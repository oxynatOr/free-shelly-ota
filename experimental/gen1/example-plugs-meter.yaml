# Second test image for the Shelly Plug S (Gen1, SHPLG-S): the first one (example-plugs-test.yaml) plus both LEDs and the power meter.
# Relay GPIO15 is read from the stock firmware v1.14.0, button GPIO13 comes from the ESPHome device page; both worked on a real plug.
# The LED pins (GPIO0 red, GPIO2 blue), the meter pins (GPIO12 select, GPIO5 CF, GPIO14 CF1) and the meter values (current resistor,
# voltage divider) come from the same ESPHome device page for the Plug S, which credits a named tester for the configuration. They
# worked on a real plug (2026-11-13): both LEDs light as described below and the meter shows voltage, current and power.
# There is no calibration: with a 41 W lamp (reference from another plug: 41 W, about 239 V) it read 250 V, 0.24 A and 48.5 W.
#
# How to see it, WITHOUT a UART adapter (never connect a UART adapter to a plug that is on mains): join the network "plugs-meter" and use
# the JSON interface at 192.168.4.1 (user admin, password = your gen1_ota_password). The addresses use the NAME of the entity with its
# capital letter, not a lower-case id:
#   curl -u admin:PASSWORD http://192.168.4.1/sensor/Power        (also /sensor/Voltage, /sensor/Current, /sensor/Energy)
#   curl -u admin:PASSWORD http://192.168.4.1/switch/Relay        and  /binary_sensor/Button
#   curl -u admin:PASSWORD -X POST http://192.168.4.1/switch/Relay/toggle      (switches the relay without the button)
# The start page http://192.168.4.1/ lists the entities, but its values are filled by a script from the internet, so offline the table
# stays empty: use the addresses above.
#   - press the button: the relay toggles, the red LED follows the relay, the blue LED is lit while the button is held
#   - put a known load on the relay (a lamp, a kettle) and look at "Power", "Voltage" and "Current"
esphome:
  name: plugs-meter

esp8266:
  board: esp_wroom_02

external_components:
  - source:
      type: local
      path: components

logger:
  baud_rate: 115200

wifi:
  ap:
    ssid: "plugs-meter"
    password: "change-me-please"

# No `ota:` block: ESPHome's own OTA needs eboot, which a Shelly Gen1 does not have.
gen1_ota:
  password: !secret gen1_ota_password
  partitions: SHPLG-S-stock.csv

# A JSON interface (and a start page) in the plug's own network, so the values can be read with the plug on mains (no UART). Version 1 is
# the smallest one and fits next to the rest, but it is deprecated in ESPHome (removal planned for 2027.1.0); its page needs the internet.
web_server:
  port: 80
  version: 1
  auth:
    type: basic
    username: admin
    password: !secret gen1_ota_password

output:
  - platform: gpio
    id: red_led
    pin:
      number: GPIO0
      inverted: true
  - platform: gpio
    id: blue_led
    pin:
      number: GPIO2
      inverted: true

switch:
  - platform: gpio
    id: relay
    name: "Relay"
    pin: GPIO15
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: red_led
    on_turn_off:
      - output.turn_off: red_led

binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - output.turn_on: blue_led
      - switch.toggle: relay
    on_release:
      - output.turn_off: blue_led

sensor:
  - platform: hlw8012
    model: BL0937
    sel_pin:
      number: GPIO12
      inverted: true
    cf_pin: GPIO5
    cf1_pin: GPIO14
    current_resistor: 0.000943
    voltage_divider: 2066
    update_interval: 10s
    current:
      name: "Current"
    voltage:
      name: "Voltage"
    power:
      name: "Power"
      # a cut-off for the test, not a safety device: the readings are not calibrated
      on_value_range:
        - above: 2400
          then:
            - switch.turn_off: relay
    energy:
      name: "Energy"
