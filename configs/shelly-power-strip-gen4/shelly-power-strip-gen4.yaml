# Shelly Power Strip 4 Gen4 (ESP32-C6) with ESPHome: 4 outlets, 2x ADE7953 metering, buttons, WS2812 LED ring.
# Pins as used by the author's working config. Build with the stock partition table and install through
# ShellyOTA (python ota.py build PowerStrip ... --esphome-factory ... --esphome-yaml shelly-power-strip-gen4.yaml).
# Copy secrets.yaml.example to secrets.yaml and fill it in.

substitutions:
  devicename: shelly-power-strip-gen4
  friendly_name: "Shelly Power Strip 4 Gen4"
  updateinterval: 10sec        # Wi-Fi signal sensor

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  project:
    name: "ioxy.free-shelly"
    version: "0.1.0"
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.flash_size: 8MB

esp32:
  variant: ESP32C6
  board: esp32-c6-devkitc-1
  flash_size: 8MB
  partitions: PowerStrip-stock.csv   # Shelly's partition table, so the app sees the layout the device really has
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_PARTITION_TABLE_OFFSET: "0x10000"   # Shelly's table is at 0x10000 on this model (ESP-IDF default: 0x8000)
    advanced:
      enable_ota_rollback: false   # kept off, as in the author's working build; not isolated as a requirement

logger:
  level: DEBUG
  hardware_uart: UART0
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  hidden: true                 # remove if your network is not hidden
  fast_connect: true
  power_save_mode: NONE
  output_power: 20db
  min_auth_mode: WPA2
  # manual_ip:                 # the author uses a static address
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  ap:
    ssid: "Shelly-Power-Strip-Gen4"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: my_ota
    allow_partition_access: true   # lets ESPHome update the bootloader later; not needed for plain app OTAs

safe_mode:
  disabled: false
  reboot_timeout: 5min
  num_attempts: 10
  boot_is_good_after: 1min

spi:
  - id: spi_bus
    clk_pin: GPIO13
    mosi_pin: GPIO11
    miso_pin: GPIO12

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    icon: mdi:signal-variant
    update_interval: ${updateinterval}
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    unit_of_measurement: "%"
    icon: mdi:percent-circle-outline
    entity_category: "diagnostic"
    filters:
      - lambda: return min(max(2.0f * (x + 100.0f), 0.0f), 100.0f);   # -100 dBm = 0 %, -50 dBm = 100 %

  - platform: ade7953_spi
    id: ade7953_0
    cs_pin: GPIO15    # Outlets 1+2
    irq_pin: GPIO6
    update_interval: 10s
    voltage:
      name: "Voltage"
    frequency:
      name: "AC Frequency"
    current_a:
      name: "Outlet 1 Current"
    current_b:
      name: "Outlet 2 Current"
    active_power_a:
      name: "Outlet 1 Power"
    active_power_b:
      name: "Outlet 2 Power"

  - platform: ade7953_spi
    id: ade7953_1
    cs_pin: GPIO10    # Outlets 3+4
    irq_pin: GPIO7
    update_interval: 10s
    voltage:
      name: "Voltage 2"
      internal: true
    frequency:
      name: "AC Frequency 2"
      internal: true
    current_a:
      name: "Outlet 3 Current"
    current_b:
      name: "Outlet 4 Current"
    active_power_a:
      name: "Outlet 3 Power"
    active_power_b:
      name: "Outlet 4 Power"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Wi-Fi SSID"
    bssid:
      name: "Wi-Fi BSSID"

switch:
  - platform: gpio
    id: relay_0
    name: "Outlet 1"
    pin: GPIO4
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:power-socket-eu

  - platform: gpio
    id: relay_1
    name: "Outlet 2"
    pin: GPIO2
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:power-socket-eu

  - platform: gpio
    id: relay_2
    name: "Outlet 3"
    pin: GPIO3
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:power-socket-eu

  - platform: gpio
    id: relay_3
    name: "Outlet 4"
    pin: GPIO1
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:power-socket-eu

binary_sensor:
  - platform: gpio
    id: button_0
    name: "Button 1"
    internal: true
    pin:
      number: GPIO20
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay_0

  - platform: gpio
    id: button_1
    name: "Button 2"
    internal: true
    pin:
      number: GPIO22
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay_1

  - platform: gpio
    id: button_2
    name: "Button 3"
    internal: true
    pin:
      number: GPIO23
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay_2

  - platform: gpio
    id: button_3
    name: "Button 4"
    internal: true
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay_3

light:
  - platform: esp32_rmt_led_strip
    id: led_strip
    name: "LED Strip"
    pin: GPIO18
    num_leds: 12
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 0s
    internal: true

  - platform: partition
    id: led_outlet_0
    internal: true
    name: "Outlet 1 LED"
    segments:
      - id: led_strip
        from: 0
        to: 2

  - platform: partition
    id: led_outlet_1
    internal: true
    name: "Outlet 2 LED"
    segments:
      - id: led_strip
        from: 3
        to: 5

  - platform: partition
    id: led_outlet_2
    internal: true
    name: "Outlet 3 LED"
    segments:
      - id: led_strip
        from: 6
        to: 8

  - platform: partition
    id: led_outlet_3
    internal: true
    name: "Outlet 4 LED"
    segments:
      - id: led_strip
        from: 9
        to: 11
