[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-shelly-ota"
dynamic = ["version"]
description = "Wrap an ESPHome image into an official-style Shelly OTA package (Gen2 to Gen4) and send it to the device"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
ble = ["bleak>=0.22"]

[project.urls]
Homepage = "https://github.com/oxynatOr/free-shelly-ota"

# This is for development (pip install -e .[ble]): the tool still runs from the checkout as `python ota.py`,
# it reads its profiles, partitions and fw/ from there, so it is not meant to be installed as a package.
[tool.setuptools]
py-modules = ["ota"]
packages = ["shelly_ota"]

[tool.setuptools.dynamic]
version = { attr = "shelly_ota.__version__" }
