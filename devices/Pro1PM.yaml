# OTA profile for Pro1PM, generated from the official 2.1.1 package.
display_name: "Pro1PM"
platform: esp32
update_id: Pro1PM        # name used by https://updates.shelly.cloud/update/<update_id>
app_ptn: app_0
app_slot_size: 0x200000   # app_0 @0x10000
pt_offset: 0x8000   # partition table address (default 0x10000)
boot_min_version: "1.0.9"   # project default for new profiles: the package carries loader 1.0.2, but a device that was updated by Shelly can report 1.0.3, and a value that is not higher is skipped. Not checked on this model yet
revision: 2   # counts changes of this profile: raise it when anything else in this file changes (see devices/profiles.lock)
layouts:   # later flash layouts of this device; the keys above describe the first one
  - since: "2.2.0"    # firmware older than this has the first layout: `send` refuses this one there
    app_slot_size: 0x300000   # app_0 @0x10000, app_1 @0x3f0000
