# OTA profile: Shelly Plug S Gen3 with the flash layout of Shelly's stable 2.2.0 (app slots of 0x300000). OTA-relevant data only.
# Not for 1.x, 2.0.x or 2.1.x: those have the layout of the PlugSG3 profile and `build` refuses the mix.
display_name: "Shelly Plug S Gen3 (2.2.0 layout)"
platform: esp32c3
update_id: PlugSG3        # name used by https://updates.shelly.cloud/update/<update_id>
package: PlugSG3          # the official package and its folder in fw/ are called PlugSG3
layout_since: "2.2.0"     # firmware older than this (1.x, 2.0.x, 2.1.x) has the old layout: `send` refuses the package there
app_ptn: app_0            # partition the manifest "app" part targets
app_slot_size: 0x300000   # app_0 @0x20000, app_1 @0x400000
boot_min_version: "1.0.9"   # same as the PlugSG3 profile
revision: 1   # counts changes of this profile: raise it when anything else in this file changes (see devices/profiles.lock)
