# OTA profile: Shelly Plug M Gen3. OTA-relevant data only (no pins, no flash addresses).
display_name: "Shelly Plug M Gen3"
platform: esp32c3
update_id: PlugMG3        # name used by https://updates.shelly.cloud/update/<update_id>
app_ptn: app_0            # partition the manifest "app" part targets
app_slot_size: 0x2a0000   # app_0 @0x20000, app_1 @0x3a0000
boot_min_version: "1.0.9"   # a Plug M restored from the official 2.0.1 package runs Shelly OS loader 1.0.3 (boot log), so the default 1.0.3 would be skipped
revision: 2   # counts changes of this profile: raise it when anything else in this file changes (see devices/profiles.lock)
