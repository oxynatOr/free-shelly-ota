# OTA profile for PlugPMG3 (Shelly Plug PM Gen3, S3PL-30116EU), written from a 2.0.1 flash dump and boot log.
display_name: "Shelly Plug PM Gen3"
platform: esp32c3
update_id: PlugPMG3       # app name in the image; the manifest name on updates.shelly.cloud is assumed to be the same
app_ptn: app_0
app_slot_size: 0x280000   # app_0 @0x20000 (smaller than the Plug M / Plug S slot 0x2a0000)
boot_min_version: "1.0.9"   # the device already runs Shelly OS loader 1.0.3 (boot log), so the default 1.0.3 would be skipped (see README)
revision: 2   # counts changes of this profile: raise it when anything else in this file changes (see devices/profiles.lock)
