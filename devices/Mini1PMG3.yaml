# OTA profile for Mini1PMG3, generated from the official 2.0.1 package.
display_name: "Shelly Mini 1PM Gen3"
platform: esp32c3
update_id: Mini1PMG3        # name used by https://updates.shelly.cloud/update/<update_id>
app_ptn: app_0
app_slot_size: 0x2a0000   # app_0 @0x20000
pt_offset: 0xf000   # partition table address (default 0x10000)
boot_min_version: "1.0.9"   # new Gen3 profiles default to 1.0.9: the installed loader on the Gen3 devices seen so far was 1.0.2 or 1.0.3 (not logged on this model yet), and a value that is not higher is skipped
revision: 3   # counts changes of this profile: raise it when anything else in this file changes (see devices/profiles.lock)
layouts:   # later flash layouts of this device; the keys above describe the first one
  - since: "2.2.1"    # firmware older than this has the first layout: `send` refuses this one there
    app_slot_size: 0x300000   # app_0 @0x20000, app_1 @0x400000
