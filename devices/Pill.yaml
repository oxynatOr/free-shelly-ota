# OTA profile for Pill, generated from the official 2.0.1 package.
display_name: "Shelly The Pill"
platform: esp32c3
update_id: Pill        # name used by https://updates.shelly.cloud/update/<update_id>
app_ptn: app_0
app_slot_size: 0x280000   # app_0 @0x20000
boot_min_version: "1.0.9"   # the default (one patch above the official loader, 1.0.3) is skipped on a unit that already runs loader 1.0.3 (seen on the Plus Uni and the H&T); 1.0.9 is above every loader seen
revision: 5   # counts changes of this profile: raise it when anything else in this file changes (see devices/profiles.lock)
layouts:   # later flash layouts of this device; the keys above describe the first one
  - since: "2.2.0"    # first stable version seen with this layout; `send` refuses it only on firmware older than `from:`
    from: "2.2.0-beta2"   # the beta has this layout too (read from the package)
    app_slot_size: 0x300000   # app_0 @0x20000, app_1 @0x400000
