# OTA profile for Dimmer0110VPMG3, generated from the official 2.0.1 package.
display_name: "Shelly Dimmer 0/1-10V PM Gen3"
platform: esp32c3
update_id: Dimmer0110VPMG3        # name used by https://updates.shelly.cloud/update/<update_id>
app_ptn: app_0
app_slot_size: 0x280000   # app_0 @0x20000
pt_offset: 0xf000   # partition table address (default 0x10000)
boot_min_version: "1.0.9"   # Shelly OS loader 1.0.3 is what these devices run; the default (one patch above) would not replace it
revision: 3   # counts changes of this profile: raise it when anything else in this file changes (see devices/profiles.lock)
layouts:   # later flash layouts of this device; the keys above describe the first one
  - since: "2.2.0"    # firmware older than this has the first layout: `send` refuses this one there
    app_slot_size: 0x300000   # app_0 @0x20000, app_1 @0x400000
